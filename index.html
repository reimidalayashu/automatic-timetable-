<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timetable Generator — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-wrapper {
      width: 100%;
      max-width: 380px;
      padding: 20px;
    }

    .login-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px 36px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo h1 {
      font-size: 1.6em;
      font-weight: 700;
      color: #00b4d8;
      letter-spacing: -0.5px;
    }

    .login-logo p {
      color: #8b949e;
      font-size: 0.85em;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85em;
      color: #c9d1d9;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-size: 0.95em;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #00b4d8;
      box-shadow: 0 0 0 3px rgba(0,180,216,0.15);
    }

    .btn-login {
      width: 100%;
      background: #00b4d8;
      color: #fff;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      font-weight: 700;
      letter-spacing: 0.3px;
      transition: background 0.2s, transform 0.1s;
      margin-top: 6px;
    }

    .btn-login:hover  { background: #0096b4; }
    .btn-login:active { transform: scale(0.98); }

    .error-msg {
      color: #f85149;
      font-size: 0.83em;
      margin-top: 12px;
      text-align: center;
      min-height: 18px;
    }

    .hint {
      color: #484f58;
      font-size: 0.76em;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-logo">
        <h1>📅 Timetable Generator</h1>
        <p>Academic Scheduling System</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login">Login →</button>
        <p id="error-msg" class="error-msg"></p>
      </form>

      <p class="hint">Default: admin / 12345</p>
    </div>
  </div>

  <script>
    // If already logged in, redirect immediately
    if (sessionStorage.getItem("loggedIn") === "true") {
      window.location.replace("hello.html");
    }

    document.getElementById("login-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const errEl    = document.getElementById("error-msg");

      if (!username || !password) {
        errEl.textContent = "Please enter both username and password.";
        return;
      }

      // Static credential check — replace with server auth when ready
      if (username === "admin" && password === "12345") {
        sessionStorage.setItem("loggedIn", "true");
        window.location.href = "hello.html";
      } else {
        errEl.textContent = "Invalid username or password.";
        document.getElementById("password").value = "";
        document.getElementById("password").focus();
      }
    });
  </script>

</body>
</html>
